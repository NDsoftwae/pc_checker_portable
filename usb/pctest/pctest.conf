# PC Hardware Test settings - edit with Notepad.

[report]
# Printed at the top of every report
company_name = PC Deals Online
technician =

[menu]
# Option started automatically when nobody presses a key (1 = quick test, 3 = full test)
default_choice = 1
timeout_seconds = 20

[tests]
cpu_stress_quick_seconds = 60
cpu_stress_full_seconds = 600
ram_quick_seconds = 60
ram_full_minutes = 30
# Amount read from each disk (read-only)
disk_read_quick_mb = 1024
disk_read_full_mb = 2048
# Run the drive's built-in SMART short self-test in full mode (read-only, ~2 min)
disk_selftest_in_full = yes
disk_selftest_max_minutes = 6
